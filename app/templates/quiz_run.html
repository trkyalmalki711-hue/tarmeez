{% include "partials/header.html" %}

<div class="card section" style="margin-top:18px">
  <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
    <div>
      <h3>Quiz</h3>
      <div class="small">Answer the questions below</div>
    </div>
    <div class="small">
      <span>Difficulty:</span> <strong>{{ difficulty }}</strong>
      <span style="margin-left:10px">Questions:</span> <strong>{{ n }}</strong>
    </div>
  </div>

  <!-- Wrapper أغمق -->
  <div class="card section" style="margin-top:14px; padding:14px; background:rgba(0,0,0,0.18);">
    <div id="quizRoot">
      <div class="small">Loading questions…</div>
    </div>

    <div class="actions" style="margin-top:14px; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap">
      <div class="actions" style="gap:10px">
        <button id="prevQuiz" class="btn btnGhost" type="button">Previous</button>
        <button id="nextQuiz" class="btn btnPrimary" type="button">Next</button>
        <button id="submitQuiz" class="btn btnPrimary" type="button">Submit</button>
        <button id="reloadQuiz" class="btn btnGhost" type="button">Reload</button>
      </div>

      <div class="small" id="quizProgress"></div>
      <div class="small" id="quizResult"></div>
    </div>
  </div>
</div>

<div id="quizConfig"
     data-kind="{{ kind }}"
     data-n="{{ n }}"
     data-difficulty="{{ difficulty }}"></div>

<script src="/static/app_quiz.js"></script>

{% include "partials/footer.html" %}
