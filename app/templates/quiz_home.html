{% include "partials/header.html" %}

<div class="card section" style="margin-top:18px">

  <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px">
    <div>
      <h3>Quiz</h3>
      <div class="small">Choose difficulty and number of questions</div>
    </div>
  </div>

  <!-- CPT QUIZ CARD -->
  <div class="card section" style="
    margin-top:14px;
    padding:14px;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.06);
  ">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
      <div>
        <strong>CPT Quiz</strong>
        <div class="small">Interactive quiz from CPT data</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:12px">
      <div>
        <div class="small" style="margin-bottom:6px">Difficulty</div>
        <select id="cptDifficulty" class="input" style="background:rgba(0,0,0,0.22);">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div>
        <div class="small" style="margin-bottom:6px">Number of Questions</div>
        <input id="cptCount" class="input" type="number" min="5" max="50" value="10"
               style="background:rgba(0,0,0,0.22);" />
      </div>
    </div>

    <div class="actions" style="margin-top:14px; gap:10px">
      <button class="btn btnPrimary" type="button" onclick="startQuiz('cpt')">Start CPT Quiz</button>
    </div>
  </div>

  <!-- ICD QUIZ CARD -->
  <div class="card section" style="
    margin-top:14px;
    padding:14px;
    background:rgba(0,0,0,0.18);
    border:1px solid rgba(255,255,255,0.06);
  ">
    <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap">
      <div>
        <strong>ICD Quiz</strong>
        <div class="small">Interactive quiz from ICD-10 data</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:12px">
      <div>
        <div class="small" style="margin-bottom:6px">Difficulty</div>
        <select id="icdDifficulty" class="input" style="background:rgba(0,0,0,0.22);">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
        </select>
      </div>

      <div>
        <div class="small" style="margin-bottom:6px">Number of Questions</div>
        <input id="icdCount" class="input" type="number" min="5" max="50" value="10"
               style="background:rgba(0,0,0,0.22);" />
      </div>
    </div>

    <div class="actions" style="margin-top:14px; gap:10px">
      <button class="btn btnPrimary" type="button" onclick="startQuiz('icd')">Start ICD Quiz</button>
    </div>
  </div>

</div>

<script>
  function clamp(n, min, max){
    n = Number(n || 0);
    return Math.max(min, Math.min(max, n));
  }

  function startQuiz(kind){
    if(kind === "cpt"){
      const n = clamp(document.getElementById("cptCount").value, 5, 50);
      const d = document.getElementById("cptDifficulty").value || "medium";
      window.location.href = `/quiz/run/cpt?n=${encodeURIComponent(n)}&difficulty=${encodeURIComponent(d)}`;
      return;
    }

    const n = clamp(document.getElementById("icdCount").value, 5, 50);
    const d = document.getElementById("icdDifficulty").value || "medium";
    window.location.href = `/quiz/run/icd?n=${encodeURIComponent(n)}&difficulty=${encodeURIComponent(d)}`;
  }
</script>

{% include "partials/footer.html" %}
