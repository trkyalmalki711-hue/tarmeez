
{% include "partials/header.html" %}
<div class="card section" style="margin-top:18px">
  <h3 data-en="Complaints & Suggestions" data-ar="الشكاوي والاقتراحات">Complaints & Suggestions</h3>

  <div class="grid" style="margin-top:14px; width:100%; grid-template-columns: 1fr 1fr; justify-items: stretch; align-items: stretch">

    <div class="card section" style="width:100%">
      <h4 data-en="Complaints" data-ar="الشكاوي">Complaints</h4>
      <div class="small" data-en="Report an issue or problem" data-ar="بلّغ عن مشكلة أو خلل">Report an issue or problem</div>
      <textarea class="input" style="height:140px; resize:vertical"
        data-ph-en="Write your complaint..."
        data-ph-ar="اكتب الشكوى هنا..."
        placeholder="Write your complaint..."></textarea>
      <button class="btn primary" style="margin-top:10px"
        data-en="Submit Complaint" data-ar="إرسال الشكوى">Submit Complaint</button>
    </div>

    <div class="card section" style="width:100%">
      <h4 data-en="Suggestions" data-ar="الاقتراحات">Suggestions</h4>
      <div class="small" data-en="Share an idea or improvement" data-ar="شاركنا فكرة أو اقتراح تطوير">Share an idea or improvement</div>
      <textarea class="input" style="height:140px; resize:vertical"
        data-ph-en="Write your suggestion..."
        data-ph-ar="اكتب اقتراحك هنا..."
        placeholder="Write your suggestion..."></textarea>
      <button class="btn primary" style="margin-top:10px"
        data-en="Submit Suggestion" data-ar="إرسال الاقتراح">Submit Suggestion</button>
    </div>

  </div>
</div>
{% include "partials/footer.html" %}
